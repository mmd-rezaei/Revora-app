# REVORA — Netlify (Next.js frontend only)
# IMPORTANT: In Netlify UI, leave Publish directory EMPTY.
# Do NOT set publish to .next — that breaks routing and SSR.

[build]
  base = "frontend"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"
